name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./apk          # ✅ points to the right folder

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./apk          # ✅ builds inside apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raven-VPN
          path: apk/build/app/outputs/flutter-apk/app-release.apk
